= log.id;\n  }\n  appState.transfers.push(rec); saveData(); refreshAll(); renderAccounts(); showToast('Transferência registrada!');\n};\nwindow.delTransfer = function (id) {\n  const f = appState.transfers.find(x => x.id === id); if (!f) return;\n  const pf = String(f.from).startsWith('pg:'), pt = String(f.to).startsWith('pg:');\n  if (pf || pt) {\n    const p = appState.piggybanks.find(x => 'pg:' + x.id === (pf ? f.from : f.to));\n    if (p) {\n      const delta = pf ? f.amount : -f.amount;\n      if ((Number(p.amount) || 0) + delta < -0.001) return showToast('Não dá para desfazer: o cofrinho ficaria negativo.', 'error');\n      p.amount = (Number(p.amount) || 0) + delta;\n    }\n    if (f.logId) appState.piggyLogs = (appState.piggyLogs || []).filter(l => l.id !== f.logId);\n  }\n  appState.transfers = appState.transfers.filter(x => x.id !== id); saveData(); refreshAll(); renderAccounts(); showToast('Transferência desfeita.');\n};\n\n/* ---------- cartão de contas no Dashboard ---------- */\nfunction injectDash() {\n  const tab = $('tab-dashboard'); if (!tab || $('dashBottom')) return;\n  const rt = $('dashRecentTable'); if (!rt) return;\n  let recent = rt; while (recent && recent.parentElement !== tab) recent = recent.parentElement; if (!recent) return;\n  const wrap = document.createElement('div'); wrap.id = 'dashBottom';\n  tab.insertBefore(wrap, recent); wrap.appendChild(recent);\n  wrap.insertAdjacentHTML('beforeend', `<div class=\"da-card\"><div class=\"da-head\"><div><div class=\"da-t\">Minhas contas</div><div class=\"da-s\" id=\"daSub\">Total nas contas</div></div><button class=\"da-link\" onclick=\"switchTab('accounts')\">Ver contas &rarr;</button></div><div class=\"da-total acc-val\" id=\"daTotal\"></div><div class=\"da-spark\"><canvas id=\"daSpark\"></canvas></div><div id=\"daList\" class=\"da-list\"></div></div>`);\n}\nfunction spark(cv, pts) {\n  const g = setup(cv); if (!g) return; const { ctx, w, h } = g;\n  const vals = pts.map(p => p.value); let lo ut = lim;\n    cut = Math.round(cut); starts.push(cut); start = cut;\n  }\n  return { starts: starts, H: H };\n}\n\n/* ---- pré-visualização ---- */\nfunction fit() {\n  var v = $('pvView'), w = $('pvWrap'), pa = $('pvPaper'); if (!v || !w) return;\n  var sc = Math.min(1, (v.clientWidth - 24) / PW);\n  pa.style.transform = 'scale(' + sc + ')'; w.style.width = Math.round(PW * sc) + 'px';\n  w.style.height = Math.round((((layout && layout.H) || PH) + 80) * sc) + 'px';\n}\nfunction refresh() {\n  var my = ++seq, fr = $('pvFrame'); if (!fr) return;\n  $('pvLoad').style.display = 'flex'; $('pvLoad').textContent = 'Montando a pré-visualização…';\n  var h;\n  try { h = html(); } catch (e) { console.error(e); $('pvLoad').textContent = 'Erro ao montar o relatório.'; return; }\n  fr.onload = function () {\n    if (my !== seq) return;\n    var doc = fr.contentDocument, c = cuts(doc);\n    fr.style.height = c.H + 'px'; layout = c;\n    doc.body.style.position = 'relative';\n    c.starts.slice(1).forEach(function (y, i) {\n      var d = doc.createElement('div');\n      d.style.cssText = 'position:absolute;left:0;right:0;top:' + y + 'px;border-top:2px dashed #94a3b8;z-index:9;pointer-events:none';\n      d.innerHTML = '<span style=\"position:absolute;right:8px;top:2px;font:700 9px Arial;color:#64748b;background:#fff;padding:0 4px\">Página ' + (i + 2) + '</span>';\n      doc.body.appendChild(d);\n    });\n    $('pvPages').textContent = c.starts.length + (c.starts.length === 1 ? ' página' : ' páginas');\n    $('pvLoad').style.display = 'none'; fit();\n  };\n  fr.srcdoc = h;\n}\nfunction later() { clearTimeout(timer); timer = setTimeout(refresh, 250); }\nfunction onKey(e) { if (e.key === 'Escape' && !busy) close(); }\nfunction close() { var o = $('pvOv'); if (o) o.remove(); document.removeEventListener('keydown', onKey); window.removeEventListener('resize', fit); clearTimeout(timer); layout = null; seq++; }\n\nwindow.exportPDF = function () {\n  close();\n  var now = new Date(), fmEl = $('filterMonth'), fyEl = $('filterYear');\n  var fm = fmEl ? fmEl.value : String(now.getMonth()), fy = (fyEl && Number(fyEl.value)) || now.getFullYear();\n  var ys = {}; ys[now.getFullYear()] = 1; ys[fy] = 1;\n  (appState.transactions || []).forEach(function (t) { var y = parseInt(String(t.date).slice(0, 4), 10); if (y > 1990 && y < 2100) ys[y] = 1; });\n  var years = Object.keys(ys).map(Number).sort(function (a, b) { return b - a; }), op = loadOpts();\n  var o = document.createElement('div'); o.id = 'pvOv'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true');\n  o.innerHTML = '<div class=\"pv-head\"><div class=\"pv-title\"><i class=\"fa-solid fa-file-pdf\"></i><span>Relatório em PDF</span><span class=\"pv-badge\" id=\"pvPages\">…</span></div><button id=\"pvX\" aria-label=\"Fechar\" class=\"pv-x\"><i class=\"fa-solid fa-xmark\"></i></button></div>' +\n    '<div class=\"pv-main\"><div class=\"pv-side\"><div><h4>Período</h4><div class=\"pv-two\"><select id=\"pvM\" aria-label=\"Mês\"><option value=\"all\">Ano inteiro</option>' + MN.map(function (n, i) { return '<option value=\"' + i + '\"' + (String(i) === fm ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select><select id=\"pvY\" aria-label=\"Ano\">' + years.map(function (y) { return '<option' + (y === fy ? ' selected' : '') + '>' + y + '</option>'; }).join('') + '</select></div></div>' +\n    '<div><h4>Incluir</h4>' + OPTS.map(function (x) { return '<label class=\"pv-sw\"><span>' + x[1] + '</span><input type=\"checkbox\" id=\"pvo_' + x[0] + '\"' + (op[x[0]] ? ' checked' : '') + '><i></i></label>'; }).join('') + '</div>' +\n    '<div class=\"pv-act\"><button class=\"pv-btn p\" id=\"pvDl\"><i class=\"fa-solid fa-download\" style=\"margin-right:.4rem\"></i>Baixar PDF</button><button class=\"pv-btn\" id=\"pvPrint\"><i class=\"fa-solid fa-print\" style=\"margin-right:.4rem\"></i>Imprimir</button></div></div>' +\n    '<div class=\"pv-view\" id=\"pvView\"><div class=\"pv-wrap\" id=\"pvWrap\"><div class=\"pv-paper\" id=\"pvPaper\" style=\"width:' + PW + 'px\"><iframe id=\"pvFrame\" title=\"Pré-visualização do relatório\" style=\"width:' + PW + 'px;height:' + PH + 'px\"></iframe></div><div class=\"pv-load\" id=\"pvLoad\">Montando a pré-visualização…</div></div></div></div>';\n  document.body.appendChild(o);\n  $('pvX').onclick = close; $('pvPrint').onclick = printIt; $('pvDl').onclick = download;\n  o.addEventListener('change', function () { try { localStorage.setItem(KEY, JSON.stringify(readOp())); } catch (e) {} later(); });\n  window.addEventListener('resize', fit); document.addEventListener('keydown', onKey);\n  refresh();\n};\n\n/* ---- imprimir (PDF vetorial pelo navegador) ---- */\nfunction printIt() {\n  var fr = document.createElement('iframe');\n  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'; fr.setAttribute('aria-hidden', 'true');\n  fr.onload = function () {\n    try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { showToast('Não foi possível abrir a impressão.', 'error'); }\n    setTimeout(function () { fr.remove(); }, 60000);\n  };\n  document.body.appendChild(fr); fr.srcdoc = html();\n}\n\n/* ---- download direto (páginas renderizadas como imagem; precisa de internet na 1ª vez) ---- */\nfunction script(src) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { s.remove(); no(new Error('lib')); }; document.head.appendChild(s); }); }\nfunction libs() {\n  if (window.html2canvas && window.jspdf) return Promise.resolve();\n  if (!libP) libP = Promise.all([\n    window.html2canvas ? 0 : script('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),\n    window.jspdf ? 0 : script('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')\n  ]).catch(function (e) { libP = null; throw e; });\n  return libP;\n}\nfunction setBtn(t) {\n  var b = $('pvDl'), p = $('pvPrint'); if (!b) return;\n  b.disabled = p.disabled = !!t;\n  b.innerHTML = '<i class=\"fa-solid ' + (t ? 'fa-spinner fa-spin' : 'fa-download') + '\" style=\"margin-right:.4rem\"></i>' + (t || 'Baixar PDF');\n}\nasync function download() {\n  if (busy) return; busy = true; var fr = null;\n  try {\n    setBtn('Preparando…'); await libs();\n    var p = period(), label = window.__pdfLabel(p.m, p.y);\n    fr = document.createElement('iframe'); fr.setAttribute('aria-hidden', 'true');\n    fr.style.cssText = 'position:fixed;left:-10000px;top:0;width:' + PW + 'px;height:' + PH + 'px;border:0';\n    document.body.appendChild(fr);\n    await new Promise(function (ok) { fr.onload = ok; fr.srcdoc = html(); });\n    var doc = fr.contentDocument; if (doc.fonts && doc.fonts.ready) await doc.fonts.ready;\n    var c = cuts(doc), n = c.starts.length, K = A4W / PW;\n    var pdf = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4', compress: true });\n    pdf.setProperties({ title: 'Relatório financeiro - ' + label, subject: 'Finanças Pessoais', creator: 'Finanças Pessoais' });\n    for (var i = 0; i < n; i++) {\n      setBtn('Página ' + (i + 1) + ' de ' + n + '…');\n      var y0 = c.starts[i], h = Math.max(1, (i + 1 < n ? c.starts[i + 1] : c.H) - y0);\n      var cv = await window.html2canvas(doc.body, { scale: 2, backgroundColor: '#ffffff', x: 0, y: y0, width: PW, height: h, windowWidth: PW, windowHeight: c.H, scrollX: 0, scrollY: 0, logging: false });\n      if (i) pdf.addPage();\n      pdf.addImage(cv.toDataURL('image/jpeg', 0.93), 'JPEG', 0, MG * K, PW * K, h * K, undefined, 'FAST');\n      pdf.setFontSize(8); pdf.setTextColor(150, 156, 168);\n      pdf.text('Relatório financeiro · ' + label, 36, A4H - 18); pdf.text('Página ' + (i + 1) + ' de ' + n, A4W - 36, A4H - 18, { align: 'right' });\n    }\n    var name = fileName(); pdf.save(name); showToast('PDF baixado: ' + name);\n  } catch (e) {\n    console.error(e);\n    showToast('Não consegui gerar o PDF direto (precisa de internet na primeira vez). Use \"Imprimir\" e escolha Salvar como PDF.', 'error');\n  } finally { if (fr) fr.remove(); busy = false; setBtn(''); }\n}\n})();\n<\/script>\n<style id=\"nb-css\">\n.nb{display:grid;gap:1.25rem}.nb-card{background:rgb(var(--c-card));border:1px solid rgb(var(--c-border));border-radius:1rem;padding:1.25rem}\n.nb h3{font-size:1rem;font-weight:700;color:rgb(var(--c-text));margin:0}.nb .s{font-size:12px;color:rgb(var(--c-text)/.55);margin-top:.15rem}\n.nb-tabs{display:flex;gap:.5rem;overflow-x:auto}.nb-tabs button,.nb-b{padding:.5rem .8rem;border-radius:.75rem;font-size:12px;font-weight:600;border:1px solid rgb(var(--c-border));color:rgb(var(--c-text)/.7);background:transparent;cursor:pointer;white-space:nowrap}\n.nb-tabs button.on{background:rgb(var(--g5)/.12);border-color:rgb(var(--g5)/.5);color:rgb(var(--g5))}.nb-b:hover{background:rgb(var(--c-hover))}.nb-b.p{background:rgb(var(--g5));color:#000;border:0}\n.nb-in{background:rgb(var(--c-bg));border:1px solid rgb(var(--c-border));border-radius:.65rem;padding:.45rem .6rem;font-size:12px;color:rgb(var(--c-text))}\n.nb-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.55rem 0;border-bottom:1px solid rgb(var(--c-border)/.5);font-size:12px}.nb-row:last-child{border:0}\n.nb-bar{height:6px;background:rgb(var(--c-border));border-radius:3px;overflow:hidden;margin:.5rem 0}.nb-bar i{display:block;height:100%;background:rgb(var(--g5));border-radius:3px}\n.nb-tbl{width:100%;border-collapse:collapse;font-size:12px}.nb-tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:rgb(var(--c-text)/.45);padding:.4rem}.nb-tbl td{padding:.5rem .4rem;border-top:1px solid rgb(var(--c-border)/.5)}.nb-tbl .r{text-align:right;white-space:nowrap}\n.nb-pos{color:#10b981}.nb-neg{color:#f43f5e}.nb-mut{color:rgb(var(--c-text)/.55)}.nb-tag{font-size:10px;font-weight:700;padding:.1rem .5rem;border-radius:9999px;background:rgb(var(--c-hover))}\n.nb-g{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr))}.nb-wrap{overflow-x:auto}\n</style>\n<script id=\"ff-novas-abas\">\n// ===== Aba nova: Análises (comparar meses + fora do padrão) e Metas dentro de Cofrinhos =====\n(function () {\n'use strict';\nvar $ = function (id) { return document.getElementById(id); };\nvar MN = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];\nvar N = function (v) { return Number(v) || 0; }, R = function (v) { return '<span class=\"acc-val\">' + formatCurr(v) + '</span>'; };\nvar mlabel = function (k) { return MN[+k.slice(5, 7) - 1] + ' de ' + k.slice(0, 4); };\nvar flow = function () { return (appState.transactions || []).filter(function (t) { return t.type === 'income' || t.type === 'expense'; }); };\nvar monthsOf = function () { var o = {}; flow().forEach(function (t) { o[String(t.date).slice(0, 7)] = 1; }); return Object.keys(o).sort().reverse(); };\nvar tabs = {};\nfunction addTab(id, label, icon, sub, render) {\n  tabs[id] = { label: label, icon: icon, sub: sub, render: render };\n  var nav = document.querySelector('nav'), st = $('nav-settings');\n  var b = document.createElement('button'); b.id = 'nav-' + id; b.className = 'nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm text-gray-400 hover:text-white hover:bg-dark-hover transition-all duration-200';\n  b.setAttribute('onclick', \"switchTab('\" + id + \"')\"); b.innerHTML = '<i class=\"fa-solid ' + icon + ' w-5 text-center\"></i><span>' + label + '</span>';\n  nav.insertBefore(b, st || null);\n  document.querySelector('main').insertAdjacentHTML('beforeend', '<section id=\"tab-' + id + '\" class=\"tab-content hidden space-y-6\"><div class=\"nb\" id=\"nb-' + id + '\"></div></section>');\n}\nfunction draw(id) { var el = $('nb-' + id); if (el) try { tabs[id].render(el); } catch (e) { console.error(e); el.innerHTML = '<div class=\"nb-card nb-mut\">Não consegui montar esta aba.</div>'; } }\nfunction pills(items, cur, fn) { return '<div class=\"nb-tabs\">' + items.map(function (x) { return '<button class=\"' + (x[0] === cur ? 'on' : '') + '\" onclick=\"' + fn + \"('\" + x[0] + \"')\" + '\">' + x[1] + '</button>'; }).join('') + '</div>'; }\nfunction monthSel(id, cur, fn, extra) { return '<select id=\"' + id + '\" class=\"nb-in\" onchange=\"' + fn + '()\">' + (extra || '') + monthsOf().map(function (k) { return '<option value=\"' + k + '\"' + (k === cur ? ' selected' : '') + '>' + mlabel(k) + '</option>'; }).join('') + '</select>'; }\n\n/* ---------- METAS ---------- */\nfunction renderGoals(el) {\n  var P = appState.piggybanks || [], L = appState.piggyLogs || [], now = new Date(), since = new Date(now.getFullYear(), now.getMonth() - 3, now.getDate()).toISOString().slice(0, 10);\n  if (!P.length) { el.innerHTML = '<div class=\"nb-card nb-mut\">Crie um cofrinho para acompanhar uma meta com prazo.</div>'; return; }\n  el.innerHTML = '<div class=\"nb-g\">' + P.map(function (p) {\n    var tgt = N(p.target), amt = N(p.amount), pct = tgt > 0 ? Math.min(100, amt / tgt * 100) : 0, left = Math.max(0, tgt - amt);\n    var net = L.filter(function (l) { return l.piggyId === p.id && l.date >= since; }).reduce(function (s, l) { return s + (/deposit|transfer_in/.test(l.type) ? N(l.amount) : /withdraw|transfer_out/.test(l.type) ? -N(l.amount) : 0); }, 0) / 3;\n    var info = '', tag = '';\n    if (!(tgt > 0)) info = 'Edite o cofrinho para definir o valor da meta.';\n    else if (left <= 0) tag = '<span class=\"nb-tag nb-pos\">Concluída</span>';\n    else {\n      if (net > 0) { var m = Math.ceil(left / net), d = new Date(now.getFullYear(), now.getMonth() + m, 1); info = 'No ritmo atual (' + formatCurr(net) + '/mês) você chega em ' + MN[d.getMonth()].slice(0, 3).toLowerCase() + '/' + d.getFullYear() + '.'; } else info = 'Sem depósitos nos últimos 3 meses para projetar.';\n      if (p.deadline) {\n        var ml = Math.max(1, Math.ceil((new Date(p.deadline + 'T00:00:00')   if (k === HK) { o = Object.assign({}, o); NV_LOCAL.forEach(function (f) { delete o[f]; }); }
  return o;
}
function nvBackup(k) { try { var raw = localStorage.getItem(k); if (raw) localStorage.setItem(k + '_pre_nuvem', raw); } catch (e) {} }
function nvWrite(k, v) {
  var out = v;
  if (k === HK) { var c = null; try { c = JSON.parse(localStorage.getItem(HK)); } catch (e) {} out = Object.assign({}, v); NV_LOCAL.forEach(function (f) { if (c && f in c) out[f] = c[f]; }); }
  try { localStorage.setItem(k, JSON.stringify(out)); return true; } catch (e) { return false; }
}
/* junta local (a) com nuvem (b): listas por id, objetos campo a campo, valor simples vale o local */
function nvMerge(a, b) {
  if (Array.isArray(a) && Array.isArray(b)) {
    var out = a.slice(), seen = {}, key = function (x) { return x && typeof x === 'object' && x.id != null ? 'i' + x.id : 's' + nvStable(x); };
    a.forEach(function (x) { seen[key(x)] = 1; });
    b.forEach(function (x) { var q = key(x); if (!seen[q]) { seen[q] = 1; out.push(x); } });
    return out;
  }
  if (a && b && typeof a === 'object' && typeof b === 'object' && !Array.isArray(a) && !Array.isArray(b)) {
    var o = Object.assign({}, b);
    Object.keys(a).forEach(function (k) { o[k] = k in b ? nvMerge(a[k], b[k]) : a[k]; });
    return o;
  }
  return a === undefined ? b : a;
}

function nvTime() { try { return new Date(nvLastOk).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
function nvLabel() {
  if (!nvUser) return 'Desconectado. Entre para sincronizar este aparelho.';
  return nvTxt + (nvLastOk && nvSt === 'ok' ? ' às ' + nvTime() : '') + ' · ' + (nvUser.email || '');
}
function nvSet(st, txt) {
  nvSt = st; nvTxt = txt;
  var f = document.querySelector('.sidebar-foot-text'); if (f) f.textContent = nvUser ? 'Nuvem: ' + txt : 'Dados salvos neste dispositivo';
  var e = $('nvStat'); if (e) e.textContent = nvLabel();
}
function nvBtns() {
  return nvUser ? '<button class="btn pri" data-dat="nv:sync">Sincronizar agora</button><button class="btn" data-dat="nv:out">Sair</button>'
    : '<button class="btn pri" data-dat="nv:login">Entrar</button>';
}

async function nvReconcile(manual) {
  if (!nvUser || !nvSb) return;
  if (nvBusy) { nvRerun = true; return; }
  nvBusy = true; nvLast = Date.now(); if (manual) nvTries = 0; nvSet('busy', 'Sincronizando…');
  var changed = [], merged = [];
  try {
    var uid = nvUser.id, meta = nvMetaGet(); meta[uid] = meta[uid] || {};
    var r = await nvSb.from('painel').select('chave,conteudo,atualizado_em').eq('user_id', uid);
    if (r.error) throw r.error;
    var rows = {}; (r.data || []).forEach(function (x) { rows[x.chave] = x; });
    for (var i = 0; i < NV_KEYS.length; i++) {
      var k = NV_KEYS[i], local = nvLocal(k), row = rows[k], m = meta[uid][k] || {}, lh = local ? nvHash(local) : null, toPush = null;
      if (!row) { if (local) toPush = local; }
      else if (!local) { if (nvWrite(k, row.conteudo)) { meta[uid][k] = { at: row.atualizado_em, h: nvHash(nvLocal(k)) }; changed.push(k); } }
      else {
        var rh = nvHash(row.conteudo);
        if (lh === rh) meta[uid][k] = { at: row.atualizado_em, h: lh };
        else if (m.at === row.atualizado_em && lh !== m.h) toPush = local;                       /* só mudou aqui */
        else if ((m.at && lh === m.h) || (k === HK && !m.at)) {                                   /* só mudou na nuvem */
          nvBackup(k); if (nvWrite(k, row.conteudo)) { meta[uid][k] = { at: row.atualizado_em, h: nvHash(nvLocal(k)) }; changed.push(k); }
        } else {                                                                                  /* mudou nos dois lados: junta */
          nvBackup(k); if (nvWrite(k, nvMerge(local, row.conteudo))) { toPush = nvLocal(k); merged.push(k); changed.push(k); }
        }
      }
      if (toPush) {
        var h = nvHash(toPush), res;
        if (!row) res = await nvSb.from('painel').insert({ user_id: uid, chave: k, conteudo: toPush }).select('atualizado_em');
        else res = await nvSb.from('painel').update({ conteudo: toPush }).eq('user_id', uid).eq('chave', k).eq('atualizado_em', row.atualizado_em).select('atualizado_em');
        if (res.error) { if (res.error.code === '23505') { nvRerun = true; continue; } throw res.error; }
        if (!res.data || !res.data.length) { nvRerun = true; continue; }
        meta[uid][k] = { at: res.data[0].atualizado_em, h: h };
      }
    }
    nvMetaSet(meta); nvLastOk = Date.now(); nvSet('ok', 'Sincronizado');
    if (changed.length) {
      RK = {};
      if (changed.indexOf(HK) >= 0) { loadH(); theme(); navRender(); }
      if (cur === 'hoje') render();
      var names = changed.filter(function (k) { return k !== HK; }).map(function (k) { return NV_NAMES[k]; });
      if (names.length) showToast((merged.length ? 'Dados juntados com a nuvem: ' : 'Atualizado da nuvem: ') + names.join(', ') + '.');
    }
  } catch (e) {
    console.warn('[nuvem]', e);
    var tbl = e && (e.code === '42P01' || e.code === 'PGRST205' || /painel/.test(e.message || ''));
    nvSet('err', !navigator.onLine ? 'Offline: pendente' : tbl ? 'Falta criar a tabela "painel" no Supabase' : 'Erro ao sincronizar'); nvRerun = false;
  }
  nvBusy = false;
  if (nvRerun && nvTries++ < 3) { nvRerun = false; setTimeout(nvReconcile, 600); } else nvRerun = false;
}
function nvTouch() { if (!nvUser) return; nvSet('off', 'Alterações pendentes'); clearTimeout(nvT); nvT = setTimeout(function () { nvReconcile(); }, 5000); }
function nvHubTouch() { if (!nvUser) return; var h = nvHash(nvLocal(HK) || {}); if (h !== nvHubH) { nvHubH = h; nvTouch(); } }

function nvClose() { var o = $('nvLogin'); if (o) o.remove(); }
function nvLogin() {
  nvClose();
  if (!nvSb) { showToast('Nuvem indisponível (sem internet?).'); return; }
  var o = document.createElement('div'); o.id = 'nvLogin'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true');
  o.style.cssText = 'position:fixed;inset:0;z-index:10030;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px';
  o.innerHTML = '<div style="width:min(100%,360px);background:rgb(var(--card));border-radius:16px;padding:20px;display:grid;gap:10px">' +
    '<b style="font-size:17px">Entrar na nuvem</b><span class="mut">Use o mesmo e-mail e senha do Finanças.</span>' +
    '<input id="nvEm" type="email" placeholder="E-mail" autocomplete="username"><input id="nvPw" type="password" placeholder="Senha" autocomplete="current-password">' +
    '<span id="nvLm" class="mut" role="status" style="min-height:18px"></span>' +
    '<div class="row"><button class="btn pri" id="nvGo">Entrar</button><button class="btn" id="nvNo">Cancelar</button></div></div>';
  document.body.appendChild(o);
  var say = function (t) { var e = $('nvLm'); if (e) e.textContent = t; };
  $('nvNo').onclick = nvClose; o.addEventListener('mousedown', function (e) { if (e.target === o) nvClose(); });
  $('nvPw').onkeydown = function (e) { if (e.key === 'Enter') $('nvGo').click(); };
  $('nvGo').onclick = async function () {
    var em = $('nvEm').value.trim(), pw = $('nvPw').value; if (!em || !pw) return say('Preencha e-mail e senha.');
    say('Entrando…');
    var r = await nvSb.auth.signInWithPassword({ email: em, password: pw });
    if (r.error) return say(/invalid login/i.test(r.error.message) ? 'E-mail ou senha incorretos.' : /confirm/i.test(r.error.message) ? 'Confirme seu e-mail e tente de novo.' : r.error.message);
    nvClose();
  };
  $('nvEm').focus();
}
function nvAct(a) {
  if (a === 'sync') nvReconcile(true);
  else if (a === 'login') nvLogin();
  else if (a === 'out') { if (nvSb) nvSb.auth.signOut(); }
}
function nvInit() {
  if (!window.supabase) { nvSet('off', 'Nuvem indisponível'); return; }
  nvSb = window.supabase.createClient(NV_URL, NV_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  nvSb.auth.onAuthStateChange(function (ev, session) {
    setTimeout(function () {
      if (session && session.user) { var was = nvUser && nvUser.id; nvUser = session.user; if (was !== nvUser.id) { nvSet('busy', 'Conectando…'); nvReconcile(); } }
      else { nvUser = null; nvSet('off', ''); }
      if (cur === 'ajustes') renderSet();
    }, 0);
  });
  window.addEventListener('storage', function (e) { if (nvUser && NV_KEYS.indexOf(e.key) >= 0 && e.key !== HK) nvTouch(); });
  document.addEventListener('visibilitychange', function () { if (!nvUser) return; if (document.hidden) nvReconcile(); else if (Date.now() - nvLast > 5 * 60 * 1000) nvReconcile(); });
  window.addEventListener('online', function () { if (nvUser) nvReconcile(); });
  setInterval(function () { if (nvUser && !document.hidden) nvReconcile(); }, 15 * 60 * 1000);
}
nvInit();

loadH(); theme(); build();
try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
try { var savedCity = localStorage.getItem('ff_weather_city'); if (savedCity) loadWeather(savedCity); } catch(e) {}
var s0 = location.hash.slice(1), initialRoute = isOn(s0) ? s0 : (H.start === 'last' && isOn(H.last) ? H.last : 'hoje');
try { history.replaceState({ dashboardDepth: 0 }, '', '#hoje'); } catch (e) {}
depth = 0;
go(initialRoute);
setTimeout(function () { showToast('Versão 2 carregada'); }, 600);
$('v-ajustes').addEventListener('input', function (e) {
  var t = e.target;
  if (t && t.id === 'sq') { sq = t.value; var p = t.selectionStart; renderSet(); var n = $('sq'); if (n) { n.focus(); try { n.setSelectionRange(p, p); } catch (x) {} } }
  else if (t && t.dataset && t.dataset.in === 'rad') document.documentElement.style.setProperty('--r-lg', t.value + 'px');
});
$('v-ajustes').addEventListener('change', function (e) { var t = e.target.closest('[data-in]'); if (t) inAct(t.dataset.in, t.value); });
})();
